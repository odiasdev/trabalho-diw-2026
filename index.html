<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLista - Catálogo de Filmes</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <img src="assets/img/logo.svg" alt="Logo do CineLista" width="48" height="48">
        <h1>CineLista</h1>
        <p>Seu catálogo pessoal de filmes</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html" aria-current="page">Início</a></li>
            <li><a href="pages/cadastro.html">Cadastrar filme</a></li>
            <li><a href="pages/sobre.html">Sobre</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Pesquisar filmes</h2>

            <form id="form-pesquisa" action="#" role="search" class="pesquisa">
                <div class="campo">
                    <label for="pesquisa">Buscar por título ou diretor</label>
                    <input type="search" id="pesquisa" name="pesquisa" placeholder="Ex.: Interestelar">
                </div>

                <div class="campo">
                    <label for="filtro-genero">Gênero</label>
                    <select id="filtro-genero" name="filtro-genero">
                        <option value="">Todos</option>
                        <option value="acao">Ação</option>
                        <option value="animacao">Animação</option>
                        <option value="comedia">Comédia</option>
                        <option value="drama">Drama</option>
                        <option value="ficcao">Ficção científica</option>
                        <option value="terror">Terror</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="filtro-status">Status</label>
                    <select id="filtro-status" name="filtro-status">
                        <option value="">Todos</option>
                        <option value="assistido">Assistido</option>
                        <option value="quero-ver">Quero ver</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="ordenar">Ordenar por</label>
                    <select id="ordenar" name="ordenar">
                        <option value="titulo">Título (A-Z)</option>
                        <option value="ano">Mais recentes</option>
                        <option value="nota">Maior nota</option>
                    </select>
                </div>

                <button type="submit">Pesquisar</button>
            </form>
        </section>

        <section>
            <h2>Meus filmes</h2>

            <p id="contador" class="contador"></p>

            <p id="mensagem" class="sucesso" role="status" hidden></p>

            <!-- Os cards são criados pelo lista.js -->
            <div id="lista-filmes" class="lista"></div>

            <p id="vazio" class="vazio" hidden></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CineLista - Trabalho de DIW</p>
    </footer>

    <script src="assets/js/dados.js"></script>
    <script src="assets/js/lista.js"></script>
</body>
</html>
