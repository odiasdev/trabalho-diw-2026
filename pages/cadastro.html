<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Filme - CineLista</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <img src="../assets/img/logo.svg" alt="Logo do CineLista" width="48" height="48">
        <h1>CineLista</h1>
        <p>Seu catálogo pessoal de filmes</p>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="cadastro.html" aria-current="page">Cadastrar filme</a></li>
            <li><a href="sobre.html">Sobre</a></li>
        </ul>
    </nav>

    <main>
        <!-- Este mesmo formulário será usado para cadastro e edição -->
        <section>
            <h2 id="titulo-pagina">Cadastrar filme</h2>

            <p class="aviso">Os campos com * são obrigatórios.</p>

            <p id="feedback" class="alerta-erro" role="alert" hidden></p>

            <form id="form-filme" action="#" method="post" class="formulario" novalidate>
                <fieldset>
                    <legend>Informações do filme</legend>

                    <div class="campo inteiro">
                        <label for="titulo">Título *</label>
                        <input type="text" id="titulo" name="titulo" required>
                    </div>

                    <div class="campo">
                        <label for="diretor">Diretor *</label>
                        <input type="text" id="diretor" name="diretor" required>
                    </div>

                    <div class="campo">
                        <label for="genero">Gênero *</label>
                        <select id="genero" name="genero" required>
                            <option value="">Selecione</option>
                            <option value="acao">Ação</option>
                            <option value="animacao">Animação</option>
                            <option value="comedia">Comédia</option>
                            <option value="drama">Drama</option>
                            <option value="ficcao">Ficção científica</option>
                            <option value="terror">Terror</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="ano">Ano de lançamento *</label>
                        <input type="number" id="ano" name="ano" min="1888" max="2030" required>
                    </div>

                    <div class="campo">
                        <label for="duracao">Duração (minutos)</label>
                        <input type="number" id="duracao" name="duracao" min="1">
                    </div>

                    <div class="campo inteiro">
                        <label for="poster">URL do pôster</label>
                        <input type="url" id="poster" name="poster" placeholder="https://...">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Minha avaliação</legend>

                    <div class="campo inteiro">
                        <span>Status</span>
                        <div class="opcoes">
                            <label><input type="radio" name="status" value="assistido" checked> Assistido</label>
                            <label><input type="radio" name="status" value="quero-ver"> Quero ver</label>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="nota">Nota (0 a 10)</label>
                        <input type="number" id="nota" name="nota" min="0" max="10" step="0.5">
                    </div>

                    <div class="campo">
                        <label for="data-assistido">Data em que assistiu</label>
                        <input type="date" id="data-assistido" name="data-assistido">
                    </div>

                    <div class="campo inteiro">
                        <label for="sinopse">Sinopse / comentário</label>
                        <textarea id="sinopse" name="sinopse" rows="4"></textarea>
                    </div>
                </fieldset>

                <div class="botoes">
                    <button type="submit" id="botao-salvar">Salvar</button>
                    <button type="reset" class="secundario">Limpar</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CineLista - Trabalho de DIW</p>
    </footer>

    <script src="../assets/js/dados.js"></script>
    <script src="../assets/js/cadastro.js"></script>
</body>
</html>
