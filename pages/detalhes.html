<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Filme - CineLista</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <img src="../assets/img/logo.svg" alt="Logo do CineLista" width="48" height="48">
        <h1>CineLista</h1>
        <p>Seu catálogo pessoal de filmes</p>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="cadastro.html">Cadastrar filme</a></li>
            <li><a href="sobre.html">Sobre</a></li>
        </ul>
    </nav>

    <!-- Os dados são preenchidos pelo detalhes.js -->
    <main class="detalhes" id="detalhes">
        <article class="filme">
            <h2 id="titulo"></h2>

            <figure>
                <img id="poster" src="../assets/img/sem-poster.svg" alt="">
                <figcaption>Pôster do filme</figcaption>
            </figure>

            <dl>
                <dt>Diretor</dt>
                <dd id="diretor"></dd>
                <dt>Gênero</dt>
                <dd id="genero"></dd>
                <dt>Ano</dt>
                <dd id="ano"></dd>
                <dt>Duração</dt>
                <dd id="duracao"></dd>
                <dt>Status</dt>
                <dd id="status"></dd>
                <dt>Nota</dt>
                <dd id="nota"></dd>
            </dl>

            <div class="sinopse">
                <h3>Sinopse</h3>
                <p id="sinopse"></p>

                <div class="botoes">
                    <a href="cadastro.html" id="link-editar" class="botao secundario">Editar</a>
                    <button type="button" id="botao-excluir" class="excluir">Excluir</button>
                    <a href="../index.html" class="botao secundario">Voltar para a lista</a>
                </div>
            </div>
        </article>

        <aside>
            <h3>Outros filmes do mesmo gênero</h3>
            <ul id="relacionados"></ul>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 CineLista - Trabalho de DIW</p>
    </footer>

    <script src="../assets/js/dados.js"></script>
    <script src="../assets/js/detalhes.js"></script>
</body>
</html>
